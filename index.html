<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скачать приложение</title>
  <script>
    const ANDROID = "https://play.google.com/store/apps/details?id=kz.uims.parking.mobile&hl=ru";
    const IOS = "https://apps.apple.com/kz/app/id6792999765";

    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (/android/i.test(ua)) {
      location.replace(ANDROID);
    } else if (isIOS) {
      location.replace(IOS);
    }
  </script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; }
    a { display: block; margin: 16px auto; max-width: 260px; padding: 14px;
        border-radius: 10px; background: #1a73e8; color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <h2>Скачать приложение</h2>
  <a href="https://play.google.com/store/apps/details?id=kz.uims.parking.mobile&hl=ru">Google Play (Android)</a>
  <a href="https://apps.apple.com/kz/app/id6792999765">App Store (iPhone)</a>
</body>
</html>
